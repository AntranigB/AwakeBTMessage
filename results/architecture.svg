<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6f6a"/></marker></defs>
<rect width="1000" height="560" fill="#07090a"/>
<text x="60" y="44" font-size="17" fill="#e8f1ee" font-family="monospace" letter-spacing="7">AWAKE</text>
<text x="60" y="66" font-size="10.5" fill="#5d6f6a" font-family="monospace">the delivery layer for the ninety seconds after the network dies</text>
<rect x="60" y="120" width="300" height="250" rx="12" fill="#0d1113" stroke="#1b2225" stroke-width="1"/><rect x="60" y="120" width="300" height="3" rx="1.5" fill="#3ddc84"/><text x="78" y="154" font-size="13" fill="#e8f1ee" font-family="monospace" letter-spacing="2">IPHONE</text><text x="78" y="172" font-size="9.5" fill="#5d6f6a" font-family="monospace">locked · airplane mode · no Wi-Fi</text><text x="78" y="200" font-size="10" fill="#9ab0aa" font-family="monospace">· CoreBluetooth central</text><text x="78" y="220" font-size="10" fill="#9ab0aa" font-family="monospace">· WhisperKit speech→text (on device)</text><text x="78" y="240" font-size="10" fill="#9ab0aa" font-family="monospace">· outbox + retry + local notification</text><text x="78" y="260" font-size="10" fill="#9ab0aa" font-family="monospace">· notifies with the screen off</text><text x="78" y="280" font-size="10" fill="#9ab0aa" font-family="monospace">· app suspended by iOS, still reachable</text>
<rect x="400" y="120" width="250" height="250" rx="12" fill="#0d1113" stroke="#1b2225" stroke-width="1"/><rect x="400" y="120" width="250" height="3" rx="1.5" fill="#3ddc84"/><text x="418" y="154" font-size="13" fill="#e8f1ee" font-family="monospace" letter-spacing="2">ANCHOR</text><text x="418" y="172" font-size="9.5" fill="#5d6f6a" font-family="monospace">always on · $8 board in production</text><text x="418" y="200" font-size="10" fill="#9ab0aa" font-family="monospace">· BLE peripheral (GATT)</text><text x="418" y="220" font-size="10" fill="#9ab0aa" font-family="monospace">· store-and-forward queue</text><text x="418" y="240" font-size="10" fill="#9ab0aa" font-family="monospace">· ChaChaPoly seal / open</text><text x="418" y="260" font-size="10" fill="#9ab0aa" font-family="monospace">· replays on reconnect</text><text x="418" y="280" font-size="10" fill="#9ab0aa" font-family="monospace">· never sleeps</text>
<rect x="690" y="120" width="250" height="250" rx="12" fill="#0d1113" stroke="#1b2225" stroke-width="1"/><rect x="690" y="120" width="250" height="3" rx="1.5" fill="#7fd4ff"/><text x="708" y="154" font-size="13" fill="#e8f1ee" font-family="monospace" letter-spacing="2">DASHBOARD</text><text x="708" y="172" font-size="9.5" fill="#5d6f6a" font-family="monospace">venue operations · localhost</text><text x="708" y="200" font-size="10" fill="#9ab0aa" font-family="monospace">· live mesh graph</text><text x="708" y="220" font-size="10" fill="#9ab0aa" font-family="monospace">· p50 / p95 delivery latency</text><text x="708" y="240" font-size="10" fill="#9ab0aa" font-family="monospace">· queue depth</text><text x="708" y="260" font-size="10" fill="#9ab0aa" font-family="monospace">· GPS position</text><text x="708" y="280" font-size="10" fill="#9ab0aa" font-family="monospace">· event log persisted to disk</text>
<line x1="360" y1="245" x2="398" y2="245" stroke="#5d6f6a" stroke-width="1.6" marker-end="url(#head)"/>
<line x1="398" y1="275" x2="360" y2="275" stroke="#5d6f6a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="379" y="212" text-anchor="middle" font-size="9" fill="#3ddc84" font-family="monospace">BLE</text>
<line x1="650" y1="245" x2="688" y2="245" stroke="#5d6f6a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="669" y="232" text-anchor="middle" font-size="9" fill="#5d6f6a" font-family="monospace">HTTP</text>
<rect x="60" y="400" width="580" height="86" rx="10" fill="#0d1113" stroke="#1b2225"/>
<text x="80" y="426" font-size="10" fill="#ffb020" font-family="monospace" letter-spacing="1.5">THE MECHANISM</text>
<text x="80" y="448" font-size="10.5" fill="#9ab0aa" font-family="monospace">iOS will not let a suspended app scan or advertise.</text>
<text x="80" y="466" font-size="10.5" fill="#c7d7d2" font-family="monospace">But it WILL wake one for a notification from a connected</text>
<text x="80" y="482" font-size="10.5" fill="#c7d7d2" font-family="monospace">peripheral. So the anchor holds the link, not the phone.</text>
<rect x="664" y="400" width="276" height="86" rx="10" fill="#0d1113" stroke="#1b2225"/>
<text x="684" y="426" font-size="10" fill="#3ddc84" font-family="monospace" letter-spacing="1.5">11-MIN SOAK · APP OPEN</text>
<text x="684" y="452" font-size="20" fill="#3ddc84" font-family="monospace">23 / 23</text>
<text x="684" y="470" font-size="9.5" fill="#5d6f6a" font-family="monospace">delivered · p50 40 ms · p95 102 ms</text>
<text x="60" y="530" font-size="9" fill="#5d6f6a" font-family="monospace">no Wi-Fi · no cellular · 688-byte frames across 5 BLE writes · 56 ms with the app backgrounded</text>
</svg>