name: Awake
options:
  bundleIdPrefix: com.awake
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"

packages:
  AwakeCore:
    path: core
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 0.9.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7JA7K56832
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Awake:
    type: application
    platform: iOS
    sources:
      - path: ios/Sources
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: Awake
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
          - location
        NSBluetoothAlwaysUsageDescription: Awake sends messages between nearby devices over Bluetooth when there is no internet or cell service.
        NSLocationWhenInUseUsageDescription: Awake shares your position with your group over Bluetooth when there is no signal.
        NSMicrophoneUsageDescription: Awake transcribes your voice on device so it can be sent as text with no internet.
    dependencies:
      - package: AwakeCore
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antranigbaghdassarian.awake
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent

  AwakeNode:
    type: application
    platform: macOS
    sources:
      - path: mac/Sources
    info:
      path: mac/Info.plist
      properties:
        CFBundleDisplayName: Awake Anchor
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSBluetoothAlwaysUsageDescription: Awake Anchor relays messages between nearby phones.
    dependencies:
      - package: AwakeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antranigbaghdassarian.awake.anchor
        CODE_SIGN_ENTITLEMENTS: mac/AwakeNode.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
